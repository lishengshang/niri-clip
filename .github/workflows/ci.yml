name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 100k 大库长稳（任务 2.5）：耗时以分钟计、要写 ~200 MiB 临时数据，
  # 不适合每次 PR，改为手动触发——Actions → CI → Run workflow，选目标分支
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 原生 UI 依赖链（smithay-client-toolkit/winit）需要系统 xkbcommon
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --check
      # --locked 与 test/build/bench 三道工序口径一致（任务 2.6 A4）：
      # 缺它则 lint 可在依赖漂移的树上通过，而 release 工序失败
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - name: cargo test --locked (XDG-isolated temp envs)
        run: cargo test --locked
      - name: release build (--locked)
        run: cargo build --release --locked && test -x target/release/niri-clip

  smoke:
    name: CLI smoke (store/list/pin/delete/wipe)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - name: Exercise core CRUD without a real Wayland session
        run: |
          set -euo pipefail
          B=target/debug/niri-clip
          cargo build --locked
          export XDG_STATE_HOME="$PWD/.smoke/state"
          export XDG_CONFIG_HOME="$PWD/.smoke/config"
          export XDG_CACHE_HOME="$PWD/.smoke/cache"
          mkdir -p "$XDG_STATE_HOME" "$XDG_CONFIG_HOME"

          "$B" wipe >/dev/null 2>&1 || true
          for i in 1 2 3; do printf 'ci-entry-%s\n' "$i" | "$B" store >/dev/null 2>&1; done

          n=$("$B" list-raw | wc -l)
          echo "rows=$n"; [ "$n" -eq 3 ]

          # list-raw 为 5 列格式 num\t▶\t★\tid\tpreview，id 在第 4 列
          first=$("$B" list-raw | head -n1 | cut -f4)
          second=$("$B" list-raw | sed -n '2p' | cut -f4)
          # ▶ 当前项（最后捕获者）固定第 1 行，星标压不过当前项
          "$B" list-raw | head -n1 | grep -q '▶'
          # pin 第 2 行（非当前项）→ ★ 落在该行但仍排当前项之后
          "$B" pin "$second" >/dev/null 2>&1
          "$B" list-raw | head -n1 | grep -q '▶'
          "$B" list-raw | sed -n '2p' | grep -q '★'

          after=$("$B" delete -f "$first" >/dev/null 2>&1; "$B" list-raw | wc -l)
          [ "$after" -eq 2 ]

          test -f "$XDG_STATE_HOME/niri-clip/db.sqlite"
          echo "SMOKE OK"

  bench:
    name: benchmarks (budget gate)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      # 预算阈值断言（ROADMAP 开销预算表，任务 1.6；实测数值唯一真相源见
      # ARCHITECTURE §9）：10k 条 list < 11ms、裸 sqlite 查询 < 4ms、
      # FTS 全库搜索 < 50ms；超限即红（实测 ≈0.95ms/0.47ms/0.16ms，余量 10 倍+，
      # CI runner 偏慢也足够）。bencher 格式：test <name> ... bench: <ns> ns/iter，
      # 数值是第 5 个字段（可能带千位逗号，先剥掉）。
      # 任务 2.6 D12：三个近乎相同的 awk 块收敛为一次循环；并补"该 bench 必须
      # 出现在输出里"的断言——否则改名一个 bench 会让门禁静默失效
      - name: cargo bench with budget assertions
        run: |
          set -euo pipefail
          cargo bench -p niri-clip-core --bench store -- --output-format bencher | tee bench.txt
          check_budget() {
            awk -v n="$1" -v lim="$2" '
              $0 ~ n && /bench:/ {
                found = 1
                gsub(/,/, "", $5)
                if ($5 + 0 >= lim) { printf "%s 预算超限: %s ns (阈值 %s)\n", n, $5, lim; bad = 1 }
              }
              END {
                if (!found) { printf "%s 未出现在 bench 输出中——门禁失效，请检查 bench 名或 criterion 配置\n", n; exit 2 }
                if (bad) exit 1
              }
            ' bench.txt
          }
          check_budget list_300_of_10k          11000000
          check_budget sqlite_select_300_of_10k  4000000
          check_budget fts_search_300_of_10k    50000000
          echo "BENCH OK"

  # 100k 大库长稳（任务 2.5）：**仅手动触发**，不进 PR 门禁（分支保护要求的
  # 六道工序不含本 job，增删它都不改变 PR 的必过检查）。
  stress:
    name: large-db stress 100k (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      # 沙盒位置显式指到 runner 的临时盘。测试自身还会把 SQLITE_TMPDIR 指到
      # 同一处——否则库在大盘、SQLite 的临时 b-tree 在小 tmpfs 时会以
      # SQLITE_FULL（"database or disk is full"）失败，而磁盘其实还有几十 G
      - name: 100k 条长稳（写入 / 查询 / 并发 / 维护 / 迁移）
        env:
          NIRI_CLIP_STRESS_DIR: ${{ runner.temp }}
        run: cargo test --locked --release -p niri-clip-core --test large_db -- --ignored --nocapture
