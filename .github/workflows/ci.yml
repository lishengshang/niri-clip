name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 原生 UI 依赖链（smithay-client-toolkit/winit）需要系统 xkbcommon
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - name: cargo test --locked (XDG-isolated temp envs)
        run: cargo test --locked
      - name: release build (--locked)
        run: cargo build --release --locked && test -x target/release/niri-clip

  smoke:
    name: CLI smoke (store/list/pin/delete/wipe)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - name: Exercise core CRUD without a real Wayland session
        run: |
          set -euo pipefail
          B=target/debug/niri-clip
          cargo build --locked
          export XDG_STATE_HOME="$PWD/.smoke/state"
          export XDG_CONFIG_HOME="$PWD/.smoke/config"
          export XDG_CACHE_HOME="$PWD/.smoke/cache"
          mkdir -p "$XDG_STATE_HOME" "$XDG_CONFIG_HOME"

          "$B" wipe >/dev/null 2>&1 || true
          for i in 1 2 3; do printf 'ci-entry-%s\n' "$i" | "$B" store >/dev/null 2>&1; done

          n=$("$B" list-raw | wc -l)
          echo "rows=$n"; [ "$n" -eq 3 ]

          # list-raw 为 5 列格式 num\t▶\t★\tid\tpreview，id 在第 4 列
          first=$("$B" list-raw | head -n1 | cut -f4)
          second=$("$B" list-raw | sed -n '2p' | cut -f4)
          # ▶ 当前项（最后捕获者）固定第 1 行，星标压不过当前项
          "$B" list-raw | head -n1 | grep -q '▶'
          # pin 第 2 行（非当前项）→ ★ 落在该行但仍排当前项之后
          "$B" pin "$second" >/dev/null 2>&1
          "$B" list-raw | head -n1 | grep -q '▶'
          "$B" list-raw | sed -n '2p' | grep -q '★'

          after=$("$B" delete -f "$first" >/dev/null 2>&1; "$B" list-raw | wc -l)
          [ "$after" -eq 2 ]

          test -f "$XDG_STATE_HOME/niri-clip/db.sqlite"
          echo "SMOKE OK"

  bench:
    name: benchmarks (budget gate)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      # 预算阈值断言（ROADMAP 开销预算表，任务 1.6）：10k 条 list < 11ms、
      # 裸 sqlite 查询 < 4ms；超限即红（实测基线 ≈0.95ms/0.47ms，余量 10 倍+，
      # CI runner 偏慢也足够）。bencher 格式：test <name> ... bench: <ns> ns/iter
      - name: cargo bench with budget assertions
        run: |
          set -euo pipefail
          cargo bench -p niri-clip-core --bench store -- --output-format bencher | tee bench.txt
          awk '/list_300_of_10k.*bench:/ { gsub(/,/,"",$5); if ($5+0 >= 11000000) { print "list 预算超限:", $5, "ns"; exit 1 } }' bench.txt
          awk '/sqlite_select_300_of_10k.*bench:/ { gsub(/,/,"",$5); if ($5+0 >= 4000000) { print "sqlite 预算超限:", $5, "ns"; exit 1 } }' bench.txt
          echo "BENCH OK"
