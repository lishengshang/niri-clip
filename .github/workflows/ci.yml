name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # 100k 大库长稳（任务 2.5）：耗时以分钟计、要写 ~200 MiB 临时数据，
  # 不适合每次 PR，改为手动触发——Actions → CI → Run workflow，选目标分支
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RELEASE_TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 原生 UI 依赖链（smithay-client-toolkit/winit）需要系统 xkbcommon
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --check
      # --locked 与 test/build/bench 三道工序口径一致（任务 2.6 A4）：
      # 缺它则 lint 可在依赖漂移的树上通过，而 release 工序失败
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      packaged_commit: ${{ steps.package.outputs.commit }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - name: cargo test --locked (XDG-isolated temp envs)
        run: cargo test --locked
      - name: release build (--locked)
        run: |
          cargo build --release --locked --workspace
          test -x target/release/niri-clip
          test -x target/release/niri-clip-gui
      - name: Package Linux x86_64 archives
        id: package
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          umask 022
          version=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -er '.packages[] | select(.name == "niri-clip") | .version')
          test "$(target/release/niri-clip --version)" = "niri-clip $version"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RELEASE_TARGET"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi

          commit=$(git rev-parse HEAD)
          timestamp=$(git show -s --format=%ct "$commit")
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          mkdir -p dist
          cli="niri-clip-v$version-$RELEASE_TARGET"
          gui="niri-clip-gui-v$version-$RELEASE_TARGET"
          for package in niri-clip niri-clip-gui; do
            archive_root="$package-v$version-$RELEASE_TARGET"
            install -Dm755 "target/release/$package" "$stage/$archive_root/$package"
            install -m644 LICENSE README.md "$stage/$archive_root/"
          done

          install -Dm644 assets/niri-clip.service "$stage/$cli/assets/niri-clip.service"
          install -Dm644 assets/niri-clip.kdl "$stage/$cli/assets/niri-clip.kdl"
          install -Dm644 config/config.toml.example "$stage/$cli/config/config.toml.example"
          mkdir -p "$stage/$cli/completions"
          binary="$stage/$cli/niri-clip"
          "$binary" man > "$stage/$cli/niri-clip.1"
          "$binary" completions bash > "$stage/$cli/completions/niri-clip.bash"
          "$binary" completions zsh > "$stage/$cli/completions/_niri-clip"
          "$binary" completions fish > "$stage/$cli/completions/niri-clip.fish"

          for archive_root in "$cli" "$gui"; do
            tar --sort=name --mtime="@$timestamp" --owner=0 --group=0 --numeric-owner \
              -C "$stage" -cf - "$archive_root" | gzip -n > "dist/$archive_root.tar.gz"
          done
          (cd dist && sha256sum "$cli.tar.gz" "$gui.tar.gz" > SHA256SUMS)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            section=$(awk -v heading="## v$version" \
              '$0 == heading || index($0, heading " - ") == 1 { print NR; exit }' docs/CHANGELOG.md)
            if [[ -z "$section" ]]; then
              echo "CHANGELOG.md has no section for v$version" >&2
              exit 1
            fi
            printf '%s\n\n%s\n' \
              "Linux x86_64 提供 CLI 和原生 GUI 的独立归档。下载后可用 \`sha256sum --check SHA256SUMS\` 校验。" \
              "[查看 v$version 更新记录]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$commit/docs/CHANGELOG.md#L$section)" \
              > dist/release-notes.md
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "artifact_name=linux-x86_64-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload release archives
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

  smoke:
    name: CLI smoke (store/list/pin/delete/wipe)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      - name: Exercise core CRUD without a real Wayland session
        run: |
          set -euo pipefail
          B=target/debug/niri-clip
          cargo build --locked
          export XDG_STATE_HOME="$PWD/.smoke/state"
          export XDG_CONFIG_HOME="$PWD/.smoke/config"
          export XDG_CACHE_HOME="$PWD/.smoke/cache"
          mkdir -p "$XDG_STATE_HOME" "$XDG_CONFIG_HOME"

          "$B" wipe >/dev/null 2>&1 || true
          for i in 1 2 3; do printf 'ci-entry-%s\n' "$i" | "$B" store >/dev/null 2>&1; done

          n=$("$B" list-raw | wc -l)
          echo "rows=$n"; [ "$n" -eq 3 ]

          # list-raw 为 5 列格式 num\t▶\t★\tid\tpreview，id 在第 4 列
          first=$("$B" list-raw | head -n1 | cut -f4)
          second=$("$B" list-raw | sed -n '2p' | cut -f4)
          # ▶ 当前项（最后捕获者）固定第 1 行，星标压不过当前项
          "$B" list-raw | head -n1 | grep -q '▶'
          # pin 第 2 行（非当前项）→ ★ 落在该行但仍排当前项之后
          "$B" pin "$second" >/dev/null 2>&1
          "$B" list-raw | head -n1 | grep -q '▶'
          "$B" list-raw | sed -n '2p' | grep -q '★'

          after=$("$B" delete -f "$first" >/dev/null 2>&1; "$B" list-raw | wc -l)
          [ "$after" -eq 2 ]

          test -f "$XDG_STATE_HOME/niri-clip/db.sqlite"
          echo "SMOKE OK"

  bench:
    name: benchmarks (budget gate)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      # 预算阈值断言（ROADMAP 开销预算表，任务 1.6；实测数值唯一真相源见
      # ARCHITECTURE §9）：10k 条 list < 11ms、裸 sqlite 查询 < 4ms、
      # FTS 全库搜索 < 50ms；超限即红（实测 ≈0.95ms/0.47ms/0.16ms，余量 10 倍+，
      # CI runner 偏慢也足够）。bencher 格式：test <name> ... bench: <ns> ns/iter，
      # 数值是第 5 个字段（可能带千位逗号，先剥掉）。
      # 任务 2.6 D12：三个近乎相同的 awk 块收敛为一次循环；并补"该 bench 必须
      # 出现在输出里"的断言——否则改名一个 bench 会让门禁静默失效
      - name: cargo bench with budget assertions
        run: |
          set -euo pipefail
          cargo bench --locked -p niri-clip-core --bench store -- --output-format bencher | tee bench.txt
          check_budget() {
            # criterion 在基线数据缺失/损坏时会把 "test <name> ..." 与
            # "bench: <ns>" 拆成两行（中间夹一条 baseline 读取 ERROR——
            # 2026-09-12 CI 实证：Cargo.lock 变动 → rust-cache 键失配 →
            # criterion 基线不完整）。故按"最近一个 test 行"记名、到
            # bench: 行取其后的数值字段，单行与拆行两种格式都兼容
            awk -v n="$1" -v lim="$2" '
              $1 == "test" && $3 == "..." { cur = $2 }
              /bench:/ && cur == n {
                found = 1
                for (i = 1; i <= NF; i++) if ($i == "bench:") { v = $(i+1); break }
                gsub(/,/, "", v)
                if (v + 0 >= lim) { printf "%s 预算超限: %s ns (阈值 %s)\n", n, v, lim; bad = 1 }
              }
              END {
                if (!found) { printf "%s 未出现在 bench 输出中——门禁失效，请检查 bench 名或 criterion 配置\n", n; exit 2 }
                if (bad) exit 1
              }
            ' bench.txt
          }
          check_budget list_300_of_10k          11000000
          check_budget sqlite_select_300_of_10k  4000000
          check_budget fts_search_300_of_10k    50000000
          echo "BENCH OK"

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [lint, test, smoke, bench]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify assets and publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_COMMIT: ${{ needs.test.outputs.packaged_commit }}
          ARTIFACT_NAME: ${{ needs.test.outputs.artifact_name }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir dist
          cd dist
          cli="niri-clip-$GITHUB_REF_NAME-$RELEASE_TARGET.tar.gz"
          gui="niri-clip-gui-$GITHUB_REF_NAME-$RELEASE_TARGET.tar.gz"
          sha256sum "$cli" "$gui" | cmp - SHA256SUMS
          test -s release-notes.md

          # Annotated tags return both the tag object and the peeled commit.
          ref="refs/tags/$GITHUB_REF_NAME"
          commit=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GH_REPO.git" "$ref" "$ref^{}" |
            awk '$2 ~ /\^\{\}$/ { peeled = $1; next } { tag = $1 } END { print (peeled != "" ? peeled : tag) }')
          test "$commit" = "$BUILT_COMMIT"

          flags=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # With assets, gh uploads to a draft before making the release public.
          gh release create "$GITHUB_REF_NAME" "$cli" "$gui" SHA256SUMS "${flags[@]}"

  # 100k 大库长稳（任务 2.5）：**仅手动触发**，不进 PR 门禁（分支保护要求的
  # 六道工序不含本 job，增删它都不改变 PR 的必过检查）。
  stress:
    name: large-db stress 100k (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
      # 沙盒位置显式指到 runner 的临时盘。测试自身还会把 SQLITE_TMPDIR 指到
      # 同一处——否则库在大盘、SQLite 的临时 b-tree 在小 tmpfs 时会以
      # SQLITE_FULL（"database or disk is full"）失败，而磁盘其实还有几十 G
      - name: 100k 条长稳（写入 / 查询 / 并发 / 维护 / 迁移）
        env:
          NIRI_CLIP_STRESS_DIR: ${{ runner.temp }}
        run: cargo test --locked --release -p niri-clip-core --test large_db -- --ignored --nocapture
