[workspace]
resolver = "2"
members = [
    "crates/niri-clip-core",
    "crates/niri-clip",
    "crates/niri-clip-gui",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["lishengshang"]
repository = "https://github.com/lishengshang/niri-clip"

[workspace.dependencies]
niri-clip-core = { path = "crates/niri-clip-core" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
notify-rust = "4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
which = "6"
iced = "0.14"
iced_exwlshell = "0.19"
wayland-client = "0.31"
wl-clipboard-rs = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
