[workspace]
resolver = "2"
members = [
    "crates/niri-clip-core",
    "crates/niri-clip",
    "crates/niri-clip-gui",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"
authors = ["lishengshang"]
repository = "https://github.com/lishengshang/niri-clip"

[workspace.dependencies]
niri-clip-core = { path = "crates/niri-clip-core" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
notify-rust = "4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只用到 rt（#[tokio::main] 多线程执行器）、time（sleep）、process（子进程）、
# macros（#[tokio::main]）——full 会拉入 net/signal/io 等无关特性
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process"] }
toml = "0.8"
which = "6"
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "image",
] }
wl-clipboard-rs = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
